name: Post to Threads

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 15분마다 (매시 2·17·32·47분)
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: post-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/post_threads.py

      - name: Commit queue changes
        run: |
          git config user.name "sns-autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "posted $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
