name: Post to Instagram

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # 15분마다 (매시 7·22·37·52분)
  workflow_dispatch:
    inputs:
      render_only:
        description: "카드만 만들고 발행하지 않기 (미리보기)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when nothing is queued
        id: check
        run: |
          if ls queue-ig/*.json >/dev/null 2>&1; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "대기 글 없음"; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Install renderer
        if: steps.check.outputs.go == '1'
        run: pip install --quiet playwright

      - name: Render cards and publish
        if: steps.check.outputs.go == '1'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          RENDER_ONLY: ${{ inputs.render_only && '1' || '0' }}
        run: |
          git config user.name "sns-autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/post_instagram.py

      - name: Commit queue changes
        if: steps.check.outputs.go == '1'
        run: |
          git rm -r -q --cached --ignore-unmatch scripts/__pycache__
          git add -A
          git diff --cached --quiet || (git commit -m "instagram posted $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
